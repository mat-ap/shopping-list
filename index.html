<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장바구니</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="장바구니">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
  :root{
    --purple:#4B1E6D;
    --purple-deep:#331347;
    --purple-tint:#F1EAF6;
    --gold:#C9A24B;
    --bg:#FAF8F5;
    --card:#FFFFFF;
    --text:#1C1B1F;
    --text-sub:#8A8580;
    --text-faint:#C4BFB8;
    --border:#EAE5DE;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:440px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    padding-bottom:48px;
  }
  header{ padding:36px 22px 22px; }
  .title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  h1{
    font-size:28px;
    font-weight:800;
    letter-spacing:-0.6px;
    color:var(--purple-deep);
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .refresh-btn{
    width:26px; height:26px;
    background:none;
    border:none;
    font-size:16px;
    color:var(--text-faint);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
  }
  .refresh-btn:active{ color:var(--purple-deep); transform:rotate(-45deg); }
  .history-btn{
    background:none;
    border:1px solid var(--border);
    border-radius:100px;
    padding:7px 14px;
    font-size:12.5px;
    font-weight:700;
    font-family:inherit;
    color:var(--text-sub);
    cursor:pointer;
  }
  .history-btn:active{ background:var(--purple-tint); color:var(--purple-deep); border-color:var(--purple-tint); }

  .progress-text{
    font-size:13.5px;
    color:var(--text-sub);
    font-weight:500;
    letter-spacing:-0.1px;
  }
  .progress-text b{ color:var(--purple-deep); font-weight:800; }

  .add-section{ padding:24px 22px 8px; }
  .add-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    border:1px solid var(--border);
  }
  .add-label{
    font-size:11px;
    font-weight:700;
    color:var(--text-faint);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:8px;
    margin-top:14px;
  }
  .add-label:first-child{ margin-top:0; }

  .autocomplete-wrap{ position:relative; }
  .autocomplete-list{
    display:none;
    position:absolute;
    top:calc(100% + 4px);
    left:0; right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    z-index:5;
    box-shadow:0 4px 16px rgba(28,20,35,0.08);
  }
  .autocomplete-list.open{ display:block; }
  .autocomplete-item{
    padding:11px 14px;
    font-size:14.5px;
    color:var(--text);
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .autocomplete-item:last-child{ border-bottom:none; }
  .autocomplete-item:active{ background:var(--purple-tint); }
  .autocomplete-item b{ color:var(--purple-deep); }
  .add-input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    transition:border-color 0.15s;
  }
  .add-input:focus{ border-color:var(--purple); background:#fff; }
  .add-input::placeholder{ color:var(--text-faint); }
  .add-row2{ display:flex; gap:8px; }
  .add-row2 .add-input{ flex:1; }
  .price-input{ text-align:right; }

  .qty-select-wrap{
    flex:1;
    position:relative;
  }
  .qty-select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-family:inherit;
    font-weight:700;
    color:var(--text);
    text-align:center;
    text-align-last:center;
    cursor:pointer;
  }
  .qty-select-wrap::after{
    content:'';
    position:absolute;
    right:14px;
    top:50%;
    width:8px; height:8px;
    border-right:2px solid var(--text-faint);
    border-bottom:2px solid var(--text-faint);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  .person-row{ display:flex; gap:8px; }
  .person-chip{
    flex:1;
    text-align:center;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    font-size:14px;
    font-weight:700;
    color:var(--text-sub);
    cursor:pointer;
    transition:all 0.15s;
    letter-spacing:0.2px;
  }
  .person-chip[data-person="SJ"].active{
    background:var(--purple);
    border-color:var(--purple);
    color:#fff;
  }
  .person-chip[data-person="JW"].active{
    background:var(--gold);
    border-color:var(--gold);
    color:#fff;
  }

  .add-btn{
    width:100%;
    background:var(--purple-deep);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:15px 0;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:background 0.15s, transform 0.1s;
    margin-top:20px;
    letter-spacing:0.2px;
  }
  .add-btn:active{ background:var(--purple); transform:scale(0.98); }
  .add-btn:disabled{ background:var(--text-faint); cursor:default; transform:none; }

  .section{ padding:28px 22px 0; }
  .section-title{
    font-size:12px;
    font-weight:700;
    color:var(--text-faint);
    letter-spacing:1.2px;
    text-transform:uppercase;
    margin-bottom:12px;
    padding-left:2px;
  }
  .section-title-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
    padding-left:2px;
  }
  .section-title-row .section-title{ margin-bottom:0; padding-left:0; }
  .section-total{
    font-size:12.5px;
    color:var(--text-sub);
    font-weight:600;
  }
  .section-total span{
    color:var(--purple-deep);
    font-weight:800;
    font-size:13.5px;
  }
    font-size:12px;
    font-weight:700;
    color:var(--text-faint);
    letter-spacing:1.2px;
    text-transform:uppercase;
    margin-bottom:12px;
    padding-left:2px;
  }

  .item-list{ display:flex; flex-direction:column; }
  .item-card{
    background:var(--card);
    padding:16px 2px;
    display:flex;
    align-items:center;
    gap:13px;
    border-bottom:1px solid var(--border);
    transition:opacity 0.3s;
  }
  .item-list .item-card:first-child{ border-top:1px solid var(--border); }
  .item-card.checked{ opacity:0.45; }

  .thumb-wrap{ position:relative; flex-shrink:0; }
  .thumb{
    width:54px; height:54px; border-radius:10px; background:var(--purple-tint);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    overflow:hidden; cursor:pointer; border:none; padding:0;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .cam-badge{
    position:absolute; right:-3px; bottom:-3px; width:20px; height:20px; border-radius:50%;
    background:var(--purple-deep); border:2px solid var(--card); display:flex; align-items:center;
    justify-content:center; font-size:10px; z-index:2; cursor:pointer; color:var(--card);
  }
  .cam-badge i{ font-size:10px; }

  .item-mid{ flex:1; min-width:0; }
  .item-top-row{ display:flex; align-items:baseline; gap:6px; margin-bottom:3px; }
  .item-name{ font-size:15px; font-weight:700; word-break:break-word; letter-spacing:-0.1px; }
  .item-card.checked .item-name{ text-decoration:line-through; color:var(--text-sub); }
  .item-qty{ font-size:12.5px; color:var(--text-faint); font-weight:600; flex-shrink:0; }
  .item-qty.multi{ color:#722F37; font-weight:800; font-size:13.5px; }
  .item-sub-row{ display:flex; align-items:center; gap:8px; margin-top:3px; flex-wrap:wrap; }
  .item-price-col{
    font-size:16px;
    font-weight:800;
    color:var(--purple-deep);
    flex-shrink:0;
    letter-spacing:-0.3px;
    text-align:right;
    min-width:56px;
  }
  .item-card.checked .item-price-col{ color:var(--text-sub); }
  .item-memo{ font-size:12px; color:var(--text-sub); }
  .item-unit{ font-size:11.5px; color:var(--text-faint); font-weight:600; display:block; margin-top:2px; }
  .item-date{ font-size:11.5px; color:var(--text-faint); font-weight:600; }
  .item-link{
    font-size:12.5px;
    color:var(--purple);
    font-weight:700;
    text-decoration:none;
  }
  .item-link:active{ opacity:0.6; }
  .item-author{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:19px; height:19px;
    border-radius:50%;
    font-size:9.5px;
    font-weight:800;
    color:#fff;
    flex-shrink:0;
  }
  .item-author.sj{ background:var(--purple); }
  .item-author.jw{ background:var(--gold); }

  .check-btn{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border); background:#fff;
    flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.15s; padding:0;
  }
  .check-btn.on{ background:var(--purple-deep); border-color:var(--purple-deep); }
  .check-btn svg{ width:13px; height:13px; opacity:0; transition:opacity 0.15s; }
  .check-btn.on svg{ opacity:1; }

  .del-btn{
    width:26px; height:26px; border:none; background:transparent; color:var(--text-faint);
    font-size:17px; cursor:pointer; flex-shrink:0; border-radius:50%;
  }
  .del-btn:active{ background:var(--border); }

  .empty{ text-align:center; padding:70px 22px; color:var(--text-sub); }
  .empty-emoji{ font-size:38px; margin-bottom:14px; opacity:0.6; }
  .empty-title{ font-size:15.5px; font-weight:700; color:var(--text); margin-bottom:4px; }
  .empty-sub{ font-size:13.5px; }

  .lightbox{
    position:fixed; inset:0; background:rgba(28,20,35,0.94); display:none;
    align-items:center; justify-content:center; flex-direction:column; z-index:100; padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:70vh; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
  .lightbox-name{ color:#fff; font-size:16px; font-weight:700; margin-top:18px; text-align:center; }
  .lightbox-hint{ color:rgba(255,255,255,0.5); font-size:12.5px; margin-top:6px; }

  .history-screen{
    position:fixed; inset:0;
    background:var(--bg);
    max-width:440px;
    margin:0 auto;
    z-index:120;
    display:none;
    flex-direction:column;
    overflow-y:auto;
  }
  .history-screen.open{ display:flex; }
  .history-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1;
  }
  .history-back{
    width:28px; height:28px;
    border:none; background:none;
    font-size:22px;
    color:var(--purple-deep);
    cursor:pointer;
    line-height:1;
  }
  .history-title{ font-size:16px; font-weight:800; color:var(--text); }

  .history-month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:20px 22px 4px;
  }
  .month-arrow{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--card);
    font-size:16px;
    color:var(--text-sub);
    cursor:pointer;
  }
  .month-label{ font-size:16px; font-weight:800; color:var(--purple-deep); min-width:110px; text-align:center; }

  .history-total-card{
    margin:16px 22px 4px;
    background:var(--purple-tint);
    border-radius:var(--radius);
    padding:20px 22px;
    text-align:center;
  }
  .history-total-label{ font-size:12.5px; color:var(--purple); font-weight:700; margin-bottom:6px; }
  .history-total-amount{ font-size:28px; font-weight:800; color:var(--purple-deep); letter-spacing:-0.6px; }

  .history-list{
    padding:18px 22px 40px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .history-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .history-card-row{
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
  }
  .history-date{
    text-align:center;
    flex-shrink:0;
    min-width:34px;
  }
  .history-date-day{ font-size:19px; font-weight:800; color:var(--purple-deep); line-height:1; }
  .history-date-month{ font-size:10.5px; color:var(--text-faint); font-weight:600; margin-top:2px; }
  .history-card-mid{ flex:1; min-width:0; }
  .history-card-names{ font-size:14.5px; font-weight:700; color:var(--text); }
  .history-card-price{ font-size:14.5px; font-weight:800; color:var(--purple-deep); flex-shrink:0; }
  .history-caret{ font-size:9px; color:var(--text-faint); flex-shrink:0; }

  .history-detail{
    border-top:1px solid var(--border);
    padding:6px 16px 12px 64px;
    background:var(--bg);
  }
  .history-detail-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 0;
  }
  .history-detail-name{ font-size:13px; color:var(--text-sub); font-weight:600; }
  .history-detail-price{ font-size:13px; color:var(--text); font-weight:700; }

  .history-empty{ text-align:center; padding:60px 22px; color:var(--text-sub); }
  .history-empty .empty-emoji{ font-size:36px; margin-bottom:12px; opacity:0.6; }
  .history-empty .empty-title{ font-size:14.5px; font-weight:700; color:var(--text); }

  .edit-modal{
    position:fixed; inset:0;
    background:rgba(28,20,35,0.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:130;
  }
  .edit-modal.open{ display:flex; }
  .edit-sheet{
    background:var(--card);
    width:100%;
    max-width:440px;
    border-radius:20px 20px 0 0;
    padding:22px 20px 28px;
    max-height:85vh;
    overflow-y:auto;
  }
  .edit-sheet-title{
    font-size:16px;
    font-weight:800;
    color:var(--purple-deep);
    margin-bottom:16px;
    text-align:center;
  }
  .edit-btn-row{
    display:flex;
    gap:8px;
    margin-top:20px;
  }
  .edit-cancel-btn{
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:15px 0;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    color:var(--text-sub);
    cursor:pointer;
  }
  .edit-btn-row .add-btn{
    flex:2;
    margin-top:0;
  }

  .item-edit-area{
    display:flex;
    align-items:center;
    gap:13px;
    flex:1;
    min-width:0;
    cursor:pointer;
  }

  .buyer-modal{
    position:fixed; inset:0;
    background:rgba(28,20,35,0.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:140;
  }
  .buyer-modal.open{ display:flex; }
  .buyer-sheet{
    background:var(--card);
    width:100%;
    max-width:440px;
    border-radius:20px 20px 0 0;
    padding:24px 20px 28px;
    text-align:center;
  }
  .buyer-sheet-title{
    font-size:16px;
    font-weight:800;
    color:var(--purple-deep);
    margin-bottom:18px;
  }
  .buyer-btn-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .buyer-btn{
    flex:1;
    padding:20px 0;
    border-radius:14px;
    border:none;
    font-size:17px;
    font-weight:800;
    font-family:inherit;
    color:#fff;
    cursor:pointer;
  }
  .buyer-btn.sj{ background:var(--purple); }
  .buyer-btn.jw{ background:var(--gold); }
  .buyer-btn:active{ opacity:0.85; }
  .buyer-cancel-btn{
    width:100%;
    background:none;
    border:none;
    padding:12px 0;
    font-size:14.5px;
    font-weight:600;
    color:var(--text-sub);
    cursor:pointer;
    font-family:inherit;
  }

  .item-buyer{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:100px;
    border:1px solid currentColor;
  }
  .item-buyer.sj{ color:var(--purple); }
  .item-buyer.jw{ color:#8A6A1E; }

  .history-detail-buyer{
    font-size:11px;
    font-weight:700;
    margin-left:8px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>장바구니</h1>
      <div class="header-actions">
        <button class="refresh-btn" id="refreshBtn" aria-label="새로고침">↻</button>
        <button class="history-btn" id="historyBtn">구매내역</button>
      </div>
    </div>
    <div class="progress-text"><b id="checkedCount">0</b>/<span id="totalCount">0</span> 구매완료</div>
  </header>

  <div class="section" id="pendingSection">
    <div class="section-title-row">
      <div class="section-title">담은 아이템</div>
      <div class="section-total">합계 <span id="pendingTotal">0원</span></div>
    </div>
    <div class="item-list" id="pendingList"></div>
  </div>

  <div class="empty" id="emptyState">
    <div class="empty-emoji">🛒</div>
    <div class="empty-title">아직 담은 품목이 없어요</div>
    <div class="empty-sub">아래에 살 물건을 입력하고 추가해보세요</div>
  </div>

  <div class="add-section">
    <div class="add-card">
      <div class="add-label">품목</div>
      <div class="autocomplete-wrap">
        <input type="text" class="add-input" id="nameInput" placeholder="상품명 (예: 세제)" maxlength="40" autocomplete="off">
        <div class="autocomplete-list" id="autocompleteList"></div>
      </div>

      <div class="add-label">수량 / 가격</div>
      <div class="add-row2">
        <div class="qty-select-wrap">
          <select class="qty-select" id="qtySelect"></select>
        </div>
        <input type="text" inputmode="numeric" class="add-input price-input" id="priceInput" placeholder="가격 (원)">
      </div>

      <div class="add-label">메모 / 링크</div>
      <input type="text" class="add-input" id="memoInput" placeholder="메모나 구매 링크를 입력하세요" maxlength="120">

      <div class="add-label">요청</div>
      <div class="person-row" id="personRow">
        <div class="person-chip" data-person="SJ">SJ</div>
        <div class="person-chip" data-person="JW">JW</div>
      </div>

      <button class="add-btn" id="addBtn">추가하기</button>
    </div>
  </div>

  <div class="section" id="doneSection" style="display:none;">
    <div class="section-title">구매완료</div>
    <div class="item-list" id="doneList"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-name" id="lightboxName"></div>
  <div class="lightbox-hint">화면을 탭하면 닫혀요</div>
</div>

<div class="edit-modal" id="editModal">
  <div class="edit-sheet">
    <div class="edit-sheet-title">항목 수정</div>

    <div class="add-label">품목</div>
    <input type="text" class="add-input" id="editNameInput" maxlength="40">

    <div class="add-label">수량 / 가격</div>
    <div class="add-row2">
      <div class="qty-select-wrap">
        <select class="qty-select" id="editQtySelect"></select>
      </div>

const autocompleteList = document.getElementById('autocompleteList');

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function getNameSuggestions(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const seen = new Set();
  const results = [];
  for(const it of items){
    if(!it.name) continue;
    const lower = it.name.toLowerCase();
    if(lower.includes(q) && !seen.has(lower)){
      seen.add(lower);
      results.push(it);
      if(results.length >= 5) break;
    }
  }
  return results;
}

function renderAutocomplete(){
  const suggestions = getNameSuggestions(nameInput.value);
  if(suggestions.length === 0){
    autocompleteList.classList.remove('open');
    autocompleteList.innerHTML = '';
    return;
  }
  const q = nameInput.value.trim();
  const re = new RegExp(`(${escapeRegex(q)})`, 'ig');
  autocompleteList.innerHTML = suggestions.map(it => {
    const highlighted = escapeHtml(it.name).replace(re, '<b>$1</b>');
    return `<div class="autocomplete-item" data-name="${escapeHtml(it.name)}">${highlighted}</div>`;
  }).join('');
  autocompleteList.classList.add('open');
}

nameInput.addEventListener('input', renderAutocomplete);

  emptyState.style.display = items.length === 0 ? 'block' : 'none';
  pendingSection.style.display = pending.length ? 'block' : 'none';
  doneSection.style.display = done.length ? 'block' : 'none';

  pendingList.innerHTML = pending.map(renderCard).join('');
  doneList.innerHTML = done.map(renderCard).join('');

    renderHistory();

function formatDate(ts){
  if(!ts || typeof ts.toDate !== 'function') return '';
  const d = ts.toDate();
  return `${d.getMonth() + 1}월 ${d.getDate()}일 구매`;
}

function renderCard(item){
  const thumbContent = item.image ? `<img src="${item.image}" alt="">` : pickEmoji(item.name);
  const thumbAction = item.image ? 'zoom' : 'photo';
  const camBadge = item.image
    ? `<button class="cam-badge" data-action="photo" data-id="${item.id}"><i class="ti ti-camera"></i></button>`
    : `<span class="cam-badge"><i class="ti ti-camera"></i></span>`;
  const qty = item.qty || 1;
  const unitPrice = Number(item.price) || 0;
  const totalPrice = unitPrice * qty;
  const priceHtml = unitPrice ? totalPrice.toLocaleString() + '원' : '';
  const unitPriceHtml = (unitPrice && qty > 1)
    ? `<span class="item-unit">개당 ${unitPrice.toLocaleString()}원</span>`
    : '';
  const memoHtml = item.memo
    ? (isUrl(item.memo)
        ? `<a class="item-link" href="${toHref(item.memo)}" target="_blank" rel="noopener noreferrer">바로가기 →</a>`
        : `<span class="item-memo">${escapeHtml(item.memo)}</span>`)
    : '';
  const authorHtml = item.author
    ? `<span class="item-author ${item.author.toLowerCase()}">${escapeHtml(item.author)}</span>`
    : '';
  const dateHtml = item.checked ? `<span class="item-date">${formatDate(item.purchasedAt)}</span>` : '';
  const buyerHtml = (item.checked && item.buyer)
    ? `<span class="item-buyer ${item.buyer.toLowerCase()}">${escapeHtml(item.buyer)} 구매</span>`
    : '';
  const midAndPrice = `
      <div class="item-mid">
        <div class="item-top-row">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-qty ${qty > 1 ? 'multi' : ''}">×${qty}</div>
        </div>
        <div class="item-sub-row">
          ${authorHtml}
          ${memoHtml}
          ${buyerHtml}
          ${dateHtml}
        </div>
      </div>
      <div class="item-price-col">
        <div>${priceHtml}</div>
        ${unitPriceHtml}
      </div>
  `;
  const midAndPriceHtml = item.checked
    ? midAndPrice
    : `<div class="item-edit-area" data-action="edit" data-id="${item.id}">${midAndPrice}</div>`;
  return `
    <div class="item-card ${item.checked ? 'checked' : ''}" data-id="${item.id}">
      <div class="thumb-wrap">
        <button class="thumb" data-action="${thumbAction}" data-id="${item.id}">${thumbContent}</button>
        ${camBadge}
      </div>
      ${midAndPriceHtml}
      <button class="check-btn ${item.checked ? 'on' : ''}" data-action="check" data-id="${item.id}">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="del-btn" data-action="del" data-id="${item.id}">✕</button>
    </div>
  `;
}

const EMOJI_MAP = [
  [['우유','치즈','계란','요거트'], '🥛'],
  [['빵','베이커리'], '🍞'],
  [['과일','사과','바나나'], '🍎'],
  [['채소','야채'], '🥬'],
  [['고기','정육'], '🥩'],

  [['휴지','화장지','물티슈'], '🧻'],
  [['세제','샴푸','비누'], '🧴'],
  [['쓰레기봉투'], '🗑️'],
  [['커피','차'], '☕'],
];
function pickEmoji(name){
  const lower = (name || '').toLowerCase();
  for(const [keywords, emoji] of EMOJI_MAP){
    if(keywords.some(k => lower.includes(k))) return emoji;
  }
  return '🛍️';
}

function isUrl(str){
  return /^(https?:\/\/|www\.)[^\s]+\.[^\s]+/i.test(str.trim());
}
function toHref(str){
  const s = str.trim();

}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 500;
        let { width, height } = img;
        if(width > height){
          if(width > maxSize){ height = Math.round(height * maxSize/width); width = maxSize; }
        }else{
          if(height > maxSize){ width = Math.round(width * maxSize/height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderHistory(){
  monthLabel.textContent = `${viewYear}년 ${viewMonth + 1}월`;

  const purchased = items.filter(i => i.checked && i.purchasedAt && typeof i.purchasedAt.toDate === 'function');
  const inMonth = purchased.filter(i => {
    const d = i.purchasedAt.toDate();
    return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
  });

  const monthTotal = inMonth.reduce((sum, i) => sum + (Number(i.price) || 0) * (Number(i.qty) || 1), 0);
  historyTotalAmount.textContent = '₩' + monthTotal.toLocaleString();

  // 같은 날짜끼리 묶기
  const groups = {};
  inMonth.forEach(i => {
    const d = i.purchasedAt.toDate();
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if(!groups[key]) groups[key] = { date: d, list: [] };
    groups[key].list.push(i);
  });

  const groupArr = Object.values(groups).sort((a, b) => b.date - a.date);

  historyEmpty.style.display = groupArr.length ? 'none' : 'block';
  historyList.innerHTML = groupArr.map(g => {
    const key = `${g.date.getFullYear()}-${g.date.getMonth()}-${g.date.getDate()}`;
    const dayTotal = g.list.reduce((sum, i) => sum + (Number(i.price) || 0) * (Number(i.qty) || 1), 0);
    const names = g.list.map(i => i.name);
    const nameLabel = names.length > 1
      ? `${escapeHtml(names[0])} 외 ${names.length - 1}개`
      : escapeHtml(names[0]);
    const isOpen = expandedHistoryKeys.has(key);
    const detailHtml = isOpen
      ? `<div class="history-detail">${g.list.map(i => {
          const q = i.qty || 1;
          const unit = Number(i.price) || 0;
          const buyerTag = i.buyer
            ? `<span class="history-detail-buyer ${i.buyer.toLowerCase() === 'sj' ? 'item-buyer sj' : 'item-buyer jw'}">${escapeHtml(i.buyer)}</span>`
            : '';
          return `
            <div class="history-detail-row">
              <span class="history-detail-name">${escapeHtml(i.name)} ${q > 1 ? `×${q}` : ''} ${buyerTag}</span>
              <span class="history-detail-price">${(unit * q).toLocaleString()}원</span>
            </div>
          `;
        }).join('')}</div>`
      : '';
    return `
      <div class="history-card ${isOpen ? 'open' : ''}">
        <div class="history-card-row" data-action="toggle-history" data-key="${key}">
          <div class="history-date">
            <div class="history-date-day">${g.date.getDate()}</div>
            <div class="history-date-month">${g.date.getMonth() + 1}월</div>
          </div>
          <div class="history-card-mid">
            <div class="history-card-names">${nameLabel}</div>
          </div>
          <div class="history-card-price">₩${dayTotal.toLocaleString()}</div>
          <div class="history-caret">${isOpen ? '▲' : '▼'}</div>
        </div>
        ${detailHtml}
      </div>
    `;
  }).join('');
}

const expandedHistoryKeys = new Set();
historyList.addEventListener('click', (e) => {
  const row = e.target.closest('[data-action="toggle-history"]');
  if(!row) return;
  const key = row.dataset.key;
  if(expandedHistoryKeys.has(key)) expandedHistoryKeys.delete(key);
  else expandedHistoryKeys.add(key);
  renderHistory();
});
</script>
</body>
</html>
